# Деплой фронтенда (Vue + Vite) на GitHub Pages.
# В настройках репозитория: Settings → Pages → Source: GitHub Actions.
# base в vite.config.js и history в router должны совпадать с именем репозитория (/RKVP/).

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Frontend/orthodox-store/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/orthodox-store/package-lock.json

      - name: Install dependencies
        working-directory: Frontend/orthodox-store
        run: npm ci

      - name: Build
        working-directory: Frontend/orthodox-store
        run: npm run build
        env:
          # Задайте в Settings → Secrets and variables → Actions → Variables
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: SPA fallback for client-side routing
        working-directory: Frontend/orthodox-store/dist
        run: cp index.html 404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Frontend/orthodox-store/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
