# Деплой фронтенда (Vue + Vite) на GitHub Pages (ветка gh-pages).
#
# Один раз в репозитории:
# 1. Settings → Pages → Build and deployment → Source: Deploy from a branch
# 2. Branch: gh-pages, Folder: / (root)
# 3. Settings → Actions → General → Workflow permissions → Read and write
#
# base в vite.config.js и history в router: /RKVP/

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Frontend/orthodox-store/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/orthodox-store/package-lock.json

      - name: Install dependencies
        working-directory: Frontend/orthodox-store
        run: npm ci

      - name: Build
        working-directory: Frontend/orthodox-store
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: SPA fallback for client-side routing
        working-directory: Frontend/orthodox-store/dist
        run: cp index.html 404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: Frontend/orthodox-store/dist
          publish_branch: gh-pages
